<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>键盘小能手 · 学打字</title>
  <meta name="description" content="给小朋友的键盘打字练习网站：分步骤练回家键行、手指伸展、逐排字母，虚拟键盘彩色手指指引，多玩家本地档案记录进步。">
  <meta name="theme-color" content="#0f172a">
  <!-- Open Graph / 社交分享卡片 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://keybuddy.1024baby.com/">
  <meta property="og:title" content="键盘小能手 · 学打字">
  <meta property="og:description" content="给小朋友的键盘打字练习网站：分步骤练指法、虚拟键盘彩色手指指引、多玩家本地档案记录进步。">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:image" content="https://keybuddy.1024baby.com/assets/icons/icon-512.png">
  <meta property="og:image:alt" content="键盘小能手 logo">
  <link rel="canonical" href="https://keybuddy.1024baby.com/">
  <!-- PWA / iPad 添加到主屏幕 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="键盘小能手">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <h1>⌨️ 键盘小能手</h1>
        <p class="subtitle">跟小键盘做朋友，一起学打字！</p>
      </div>
      <div class="player-menu" id="playerMenu">
        <button id="playerTrigger" class="player-trigger" title="点击管理玩家" aria-haspopup="true" aria-expanded="false">
          <span class="avatar" id="playerAvatar">打</span>
          <span class="pname" id="playerName">打字小白</span>
          <span class="caret">▾</span>
        </button>
        <div class="player-dropdown" id="playerDropdown" hidden>
          <div class="dropdown-title">切换玩家</div>
          <div class="dropdown-list" id="dropdownList"></div>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" id="btnAddProfile">＋ 新增玩家</button>
          <button class="dropdown-item" id="btnRenameProfile">✎ 重命名</button>
          <button class="dropdown-item danger" id="btnDeleteProfile">🗑 删除当前</button>
        </div>
      </div>
    </header>

    <section class="lesson-bar">
      <div class="lesson-list" id="lessonList">
        <span class="lesson-label">选一关：</span>
      </div>
    </section>

    <main class="play-area" id="playArea" hidden>
      <div class="stats" id="stats">
        <div class="stat"><span class="stat-val" id="statTime">0s</span><span class="stat-key">时间</span></div>
        <div class="stat"><span class="stat-val" id="statWpm">0</span><span class="stat-key">速度</span></div>
        <div class="stat"><span class="stat-val" id="statAcc">100%</span><span class="stat-key">正确率</span></div>
        <div class="stat"><span class="stat-val" id="statProg">0%</span><span class="stat-key">进度</span></div>
      </div>

      <div class="text-display" id="textDisplay" tabindex="0"></div>

      <button class="btn-restart" id="btnRestart">↻ 重新来过</button>
    </main>

    <div class="keyboard" id="keyboard"></div>

    <div class="hint" id="hint">提示：在电脑上直接敲键盘，在平板上点下面的按键～</div>

    <footer class="site-footer">
      <a class="beian" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">闽ICP备2026001486号</a>
    </footer>
  </div>

  <div class="result-modal" id="resultModal" hidden>
    <div class="result-card">
      <h2>🎉 完成啦！</h2>
      <div class="result-stats" id="resultStats"></div>
      <button class="btn-primary" id="btnAgain">再来一关</button>
    </div>
  </div>

  <script src="/assets/js/keyboard.js"></script>
  <script src="/assets/js/typing.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
