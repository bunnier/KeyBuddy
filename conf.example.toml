# 是否是开发或测试环境。用于启用一些正式环境没有的功能。
DevMode = true

# Web 服务监听的端口。
ApiPort = 9212

# 静态资源目录（可选）。
# 留空则使用编译内置的前端资源；本地开发时可指向 api/static 实现前端热更新。
StaticDir = ""

# 站点基础路径（可选），用于生成资源链接。
BaseURL = ""

# SQLite 数据库文件路径（相对或绝对）。进度等数据持久化到该文件。
# 留空默认 "keyboard.db"（在服务启动目录下生成）。部署时建议挂载卷保证数据不丢。
# 框架使用 sqlmer（自带的 sqlite 驱动，纯 Go、无 CGO），暂不依赖 MySQL。
SqlitePath = "keyboard.db"
